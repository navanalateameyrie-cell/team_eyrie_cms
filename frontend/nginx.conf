server {
    listen 8080;
    server_name _;

    # SPA assets with history fallback so react-router deep links work on reload.
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed Vite assets.
    location /assets/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # API passthrough. Container-DNS resolves "api" to the backend service via docker-compose.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering        off;
        proxy_read_timeout     600s;
        client_max_body_size   64m;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable security defaults for the static side (the API sets its own in Program.cs).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
